<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
  <title>Incline DB Row weight and reps over time</title>
  <desc>Dot plot from Sep 8 to Sep 22. Vertical position is weight and dot size represents reps or time.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="82" y="24" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">Incline DB Row</text>
  <text x="82" y="44" font-family="Inter, Arial, sans-serif" font-size="12" fill="#59636e">Weight by date · dot size = reps/time</text>
  <line x1="82" y1="314" x2="732" y2="314" stroke="#d7dde4"/>
  <line x1="82" y1="58" x2="82" y2="314" stroke="#d7dde4"/>
  <line x1="82" y1="186.0" x2="732" y2="186.0" stroke="#eef1f5"/>
  <text x="70" y="318.0" text-anchor="end">34.7</text><text x="70" y="190.0" text-anchor="end">36.25</text><text x="70" y="62.0" text-anchor="end">37.8</text>
  <g fill="#0b57d0" fill-opacity="0.62" stroke="#0847a8" stroke-width="1"><circle cx="82.0" cy="289.2" r="11.8"><title>Sep 8 · Set 1: 35 weight, 10.0 reps/time</title></circle><circle cx="82.0" cy="289.2" r="10.6"><title>Sep 8 · Set 2: 35 weight, 7.0 reps/time</title></circle><circle cx="85.5" cy="289.2" r="11.4"><title>Sep 8 · Set 3: 35 weight, 9.0 reps/time</title></circle><circle cx="92.5" cy="289.2" r="10.2"><title>Sep 8 · Set 4: 35 weight, 6.0 reps/time</title></circle><circle cx="396.5" cy="289.2" r="12.5"><title>Sep 15 · Set 1: 35 weight, 12.0 reps/time</title></circle><circle cx="403.5" cy="289.2" r="11.8"><title>Sep 15 · Set 2: 35 weight, 10.0 reps/time</title></circle><circle cx="410.5" cy="289.2" r="11.0"><title>Sep 15 · Set 3: 35 weight, 8.0 reps/time</title></circle><circle cx="417.5" cy="289.2" r="10.6"><title>Sep 15 · Set 4: 35 weight, 7.0 reps/time</title></circle><circle cx="721.5" cy="82.8" r="12.2"><title>Sep 22 · Set 1: 37.5 weight, 11.0 reps/time</title></circle><circle cx="728.5" cy="289.2" r="11.4"><title>Sep 22 · Set 2: 35 weight, 9.0 reps/time</title></circle><circle cx="732.0" cy="289.2" r="11.0"><title>Sep 22 · Set 3: 35 weight, 8.0 reps/time</title></circle><circle cx="732.0" cy="289.2" r="4.5"><title>Sep 22 · Set 4: 35 weight, not recorded reps/time</title></circle></g>
  <text x="30" y="186.0" font-family="Inter, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="middle" transform="rotate(-90 30 186.0)">Weight</text>
  <text x="82" y="350" font-family="Inter, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="start">Sep 8</text>
  <text x="732" y="350" font-family="Inter, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="end">Sep 22</text>
  <text x="407.0" y="370" font-family="Inter, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="middle">Time</text>
</svg>
