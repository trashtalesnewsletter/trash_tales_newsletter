<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
  <title>Decline Sit-up weight and reps over time</title>
  <desc>Dot plot from Sep 10 to Sep 24. Vertical position is weight and dot size represents reps or time.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="82" y="24" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">Decline Sit-up</text>
  <text x="82" y="44" font-family="Inter, Arial, sans-serif" font-size="12" fill="#59636e">Weight by date · dot size = reps/time</text>
  <line x1="82" y1="314" x2="732" y2="314" stroke="#d7dde4"/>
  <line x1="82" y1="58" x2="82" y2="314" stroke="#d7dde4"/>
  <line x1="82" y1="186.0" x2="732" y2="186.0" stroke="#eef1f5"/>
  <text x="70" y="318.0" text-anchor="end">BW</text><text x="70" y="190.0" text-anchor="end">4.95</text><text x="70" y="62.0" text-anchor="end">9.9</text>
  <g fill="#0b57d0" fill-opacity="0.62" stroke="#0847a8" stroke-width="1"><circle cx="82.0" cy="314.0" r="12.5"><title>Sep 10 · Set 1: BW weight, 15.0 reps/time</title></circle><circle cx="82.0" cy="81.3" r="12.5"><title>Sep 10 · Set 2: 9 weight, 15.0 reps/time</title></circle><circle cx="89.0" cy="81.3" r="12.5"><title>Sep 10 · Set 3: 9 weight, 15.0 reps/time</title></circle><circle cx="725.0" cy="81.3" r="12.5"><title>Sep 24 · Set 1: 9 weight, 15.0 reps/time</title></circle><circle cx="732.0" cy="81.3" r="12.5"><title>Sep 24 · Set 2: 9 weight, 15.0 reps/time</title></circle><circle cx="732.0" cy="81.3" r="12.5"><title>Sep 24 · Set 3: 9 weight, 15.0 reps/time</title></circle></g>
  <text x="30" y="186.0" font-family="Inter, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="middle" transform="rotate(-90 30 186.0)">Weight</text>
  <text x="82" y="350" font-family="Inter, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="start">Sep 10</text>
  <text x="732" y="350" font-family="Inter, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="end">Sep 24</text>
  <text x="407.0" y="370" font-family="Inter, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="middle">Time</text>
</svg>
